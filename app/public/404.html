<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Printfinity</title>
    <!--
      GitHub Pages no soporta rutas del lado del servidor para SPAs: cualquier
      ruta que no sea la raiz del repo (ej. /Printfinity/pedidos) devuelve este
      404.html. Aqui la reescribimos como query string y la restauramos en
      index.html antes de que React Router monte. Patron estandar:
      https://github.com/rafgraph/spa-github-pages
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1; // 1 segmento: /Printfinity/
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
