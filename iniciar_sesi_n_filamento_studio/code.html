<!DOCTYPE html><html class="h-full bg-[#0B0B0C]" lang="es" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Iniciar sesión | Filamento Studio</title>
<!-- Tailwind CSS v3 with forms & container-queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Custom Configuration -->
<script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              bg: '#0B0B0C',
              card: '#161618',
              input: '#111113',
              hover: '#1E1E22',
              border: '#26262A',
              textPrimary: '#F5F5F5',
              textSecondary: '#9A9AA2',
              cta: '#F4F4F2',
              ctaHover: '#E5E5E3',
              ctaDark: '#0B0B0C',
              badgeGreenBg: '#09251B',
              badgeGreenText: '#2ED47A'
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'sans-serif']
          }
        }
      }
    };
  </script>
<!-- Custom Style Rules for Fine-Tuned Inputs and Effects -->
<style data-purpose="custom-enhancements">
    /* Subtle focus border transition matching screenshot visual design */
    .input-precision:focus {
      border-color: #55555C;
      outline: none;
      box-shadow: 0 0 0 1px #55555C;
    }
  </style>
</head>
<body class="h-full text-brand-textPrimary font-sans antialiased flex flex-col justify-between select-none">
<!-- BEGIN: MainHeader -->
<!-- Top brand bar providing subtle orientation and connection to the app shell -->

<!-- END: MainHeader -->
<!-- BEGIN: AuthSection -->
<main class="flex-grow flex items-center justify-center px-4 py-8 sm:py-12">
<div class="w-full max-w-[440px] bg-brand-card border border-brand-border rounded-2xl p-7 sm:p-9 shadow-2xl relative overflow-hidden" data-purpose="login-card">
<!-- Top Card Identity & Heading -->
<div class="text-center mb-7">
<div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-white mb-4 shadow-sm">
<div class="w-5 h-5 rounded-[4px] bg-[#0B0B0C]"></div>
</div>
<h1 class="text-2xl font-bold tracking-tight text-white">Iniciar sesión</h1>

</div>
<!-- Quick OAuth Login Action -->
<div class="space-y-4 mb-6">
<button class="w-full flex items-center justify-center space-x-3 py-2.5 px-4 rounded-xl border border-brand-border bg-[#1C1B1E] hover:bg-brand-hover text-sm font-medium text-brand-textPrimary transition-colors duration-150 focus:outline-none focus:ring-1 focus:ring-brand-border" data-purpose="google-oauth-button" type="button">
<!-- Google Multicolor Official SVG Logo -->
<svg class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"></path>
</svg>
<span class="">Continuar con Google</span>
</button>
<!-- Divider with label -->
<div class="relative flex items-center justify-center">
<div class="border-t border-brand-border/70 w-full"></div>

<div class="border-t border-brand-border/70 w-full"></div>
</div>
</div>
<!-- BEGIN: CredentialsForm -->
<form action="#" class="space-y-4" data-purpose="login-credentials-form" method="POST" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div>
<label class="block text-xs font-medium text-brand-textSecondary mb-1.5" for="email">Correo electrónico</label>
<div class="relative">
<input autocomplete="email" class="input-precision w-full px-3.5 py-2.5 bg-brand-input border border-brand-border rounded-lg text-sm text-white placeholder:text-[#55555D] transition-colors" id="email" name="email" placeholder="usuario@gmail.com" required="" type="email">
</div>
</div>
<!-- Password Field -->
<div>
<label class="block text-xs font-medium text-brand-textSecondary mb-1.5" for="password">Contraseña</label>
<div class="relative">
<input autocomplete="current-password" class="input-precision w-full px-3.5 py-2.5 pr-11 bg-brand-input border border-brand-border rounded-lg text-sm text-white placeholder:text-[#55555D] transition-colors" id="password" name="password" placeholder="••••••••••••" required="" type="password">
<!-- Toggle password visibility button -->
<button aria-label="Alternar visibilidad de contraseña" class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-brand-textSecondary hover:text-white transition-colors focus:outline-none" id="togglePasswordBtn" type="button">
<!-- Eye Icon (Default) -->
<svg class="w-4 h-4" fill="none" id="eyeIcon" stroke="currentColor" viewBox="0 0 24 24">
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
<path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
<!-- Eye Slash Icon (Hidden) -->
<svg class="w-4 h-4 hidden" fill="none" id="eyeSlashIcon" stroke="currentColor" viewBox="0 0 24 24">
<path d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
</button>
</div>
</div>
<!-- Auxiliar actions row -->
<div class="flex items-center justify-between text-xs pt-1">
<label class="flex items-center space-x-2 cursor-pointer group">
<input class="w-4 h-4 rounded bg-brand-input border-brand-border text-white focus:ring-0 focus:ring-offset-0 transition cursor-pointer" id="remember-me" name="remember-me" type="checkbox">
<span class="text-brand-textSecondary group-hover:text-white transition-colors">Recordar sesión</span>
</label>
<a class="text-brand-textSecondary hover:text-white transition-colors font-medium hover:underline" href="#">¿Olvidaste tu contraseña?</a>
</div>
<!-- Primary Call to Action -->
<div class="pt-3">
<button class="w-full bg-brand-cta hover:bg-brand-ctaHover text-brand-ctaDark font-semibold py-2.5 px-4 rounded-xl text-sm transition-all duration-150 flex items-center justify-center space-x-2 shadow hover:shadow-md active:scale-[0.99]" data-purpose="submit-login-button" type="submit">
<span class="">Iniciar sesión</span>
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M14 5l7 7m0 0l-7 7m7-7H3" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
</div>
</form>
<!-- END: CredentialsForm -->
<!-- Secondary Footnote inside card -->
<div class="mt-6 pt-5 border-t border-brand-border/60 text-center text-xs text-brand-textSecondary">
        ¿No tienes una cuenta aún? 
        <a class="text-white hover:underline font-semibold ml-1" href="#">Regístrate</a>
</div>
</div>
</main>
<!-- END: AuthSection -->
<!-- BEGIN: SiteFooter -->

<!-- END: SiteFooter -->
<!-- Toggle Password Interactivity -->
<script data-purpose="toggle-password-visibility">
    document.addEventListener('DOMContentLoaded', () => {
      const toggleBtn = document.getElementById('togglePasswordBtn');
      const passwordInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eyeIcon');
      const eyeSlashIcon = document.getElementById('eyeSlashIcon');

      if (toggleBtn && passwordInput) {
        toggleBtn.addEventListener('click', () => {
          const isPassword = passwordInput.getAttribute('type') === 'password';
          passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
          eyeIcon.classList.toggle('hidden', isPassword);
          eyeSlashIcon.classList.toggle('hidden', !isPassword);
        });
      }
    });
  </script>


</body></html>
